site_name: Jordy Support
site_description: "Free guides to using AI agents for research, writing, and everyday work."
site_url: https://jordysupport.com/
repo_url: https://github.com/jordysupport/jordysupport.github.io
repo_name: jordysupport/jordysupport.github.io
edit_uri: edit/main/docs/

copyright: >-
  Jordy Support. Free guides and downloads.
  <a href="https://ko-fi.com/support_jordy">Support on Ko-fi</a> ·
  <a href="https://linktr.ee/jordy_support">All links</a>

theme:
  name: material
  custom_dir: overrides
  language: en
  icon:
    logo: material/toolbox-outline
    repo: fontawesome/brands/github
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy

plugins:
  - search:
      lang: en
  # Insurance against future renames: if a page slug ever has to change,
  # map old -> new here in the same commit (see CONVENTIONS.md).
  - redirects:
      redirect_maps: {}
  - git-revision-date-localized:
      type: date
      enable_creation_date: false
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  cf_analytics_token: 72c89862c4fd4440a0afc427ed3a197b
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jordysupport
      name: Jordy Support on GitHub
    - icon: material/coffee-outline
      link: https://ko-fi.com/support_jordy
      name: Support Jordy on Ko-fi
    - icon: material/link-variant
      link: https://linktr.ee/jordy_support
      name: Jordy Support links

